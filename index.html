<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Professional Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <!-- Display -->
        <section class="display">

            <div id="history" class="history">
                0
            </div>

            <div id="display" class="result">
                0
            </div>

        </section>


        <!-- Calculator Buttons -->
        <section class="buttons">

            <!-- Row 1 -->
            <button class="function" data-action="clear">
                AC
            </button>

            <button class="function" data-action="sign">
                +/−
            </button>

            <button class="function" data-action="percent">
                %
            </button>

            <button class="operator" data-value="/">
                ÷
            </button>


            <!-- Row 2 -->
            <button class="number" data-value="7">
                7
            </button>

            <button class="number" data-value="8">
                8
            </button>

            <button class="number" data-value="9">
                9
            </button>

            <button class="operator" data-value="*">
                ×
            </button>


            <!-- Row 3 -->
            <button class="number" data-value="4">
                4
            </button>

            <button class="number" data-value="5">
                5
            </button>

            <button class="number" data-value="6">
                6
            </button>

            <button class="operator" data-value="-">
                −
            </button>


            <!-- Row 4 -->
            <button class="number" data-value="1">
                1
            </button>

            <button class="number" data-value="2">
                2
            </button>

            <button class="number" data-value="3">
                3
            </button>

            <button class="operator" data-value="+">
                +
            </button>


            <!-- Row 5 -->
            <button class="number zero" data-value="0">
                0
            </button>

            <button class="number" data-value=".">
                .
            </button>

            <button class="operator equal" data-action="calculate">
                =
            </button>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
